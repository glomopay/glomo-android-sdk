name: Publish to Maven Central

on:
    push:
        tags:
            - "v[0-9]+.[0-9]+.[0-9]+"

concurrency:
    group: publish
    cancel-in-progress: false

jobs:
    verify:
        runs-on: ubuntu-latest
        timeout-minutes: 5
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Verify release tag
              run: |
                  VERSION="${GITHUB_REF_NAME#v}"
                  TAG_SHA=$(git rev-parse "$GITHUB_REF_NAME")
                  BRANCH="release-$VERSION"

                  # Gate 1: Verify release branch exists
                  if ! git rev-parse "origin/$BRANCH" >/dev/null 2>&1; then
                    echo "::error::Release branch $BRANCH does not exist."
                    exit 1
                  fi

                  # Gate 2: Verify branch HEAD matches tag
                  BRANCH_SHA=$(git rev-parse "origin/$BRANCH")

                  echo "Tag:    $GITHUB_REF_NAME ($TAG_SHA)"
                  echo "Branch: $BRANCH ($BRANCH_SHA)"

                  if [ "$TAG_SHA" != "$BRANCH_SHA" ]; then
                    echo "::error::SHA mismatch - tag ($TAG_SHA) does not match release branch ($BRANCH_SHA). Aborting."
                    exit 1
                  fi

                  echo "Verified: tag matches the release branch."

                  # Gate 3: Verify CHANGELOG.md has an entry for this version
                  git checkout "origin/$BRANCH" -- CHANGELOG.md
                  if ! grep -q "^## \[$VERSION\]" CHANGELOG.md; then
                    echo "::error::CHANGELOG.md has no entry for version $VERSION"
                    exit 1
                  fi
                  echo "Verified: changelog entry exists for $VERSION."

    publish:
        needs: verify
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: ${{ github.ref }}

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - name: Publish to Maven Central
              env:
                  ORG_GRADLE_PROJECT_mavenCentralUsername: ${{ secrets.SONATYPE_USERNAME }}
                  ORG_GRADLE_PROJECT_mavenCentralPassword: ${{ secrets.SONATYPE_PASSWORD }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyId: ${{ secrets.GPG_KEY_ID }}
                  ORG_GRADLE_PROJECT_signingInMemoryKey: ${{ secrets.GPG_SIGNING_KEY }}
                  ORG_GRADLE_PROJECT_signingInMemoryKeyPassword: ${{ secrets.GPG_SIGNING_PASSWORD }}
              run: ./gradlew :glomo-android-sdk:publishAndReleaseToMavenCentral --no-configuration-cache
