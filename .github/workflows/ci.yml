name: CI

on:
    workflow_dispatch:
    push:
        branches: [main]
        paths:
            - "glomo-android-sdk/**"
            - "gradle/**"
            - "build.gradle.kts"
            - "settings.gradle.kts"
            - "gradle.properties"
            - ".github/workflows/ci.yml"
    pull_request:
        branches: [main]
        paths:
            - "glomo-android-sdk/**"
            - "gradle/**"
            - "build.gradle.kts"
            - "settings.gradle.kts"
            - "gradle.properties"
            - ".github/workflows/ci.yml"

concurrency:
    group: ci-${{ github.ref }}
    cancel-in-progress: true

jobs:
    check:
        runs-on: ubuntu-latest
        timeout-minutes: 15
        steps:
            - uses: actions/checkout@v4

            - uses: actions/setup-java@v4
              with:
                  distribution: temurin
                  java-version: 17

            - uses: gradle/actions/setup-gradle@v4

            - name: Build SDK
              run: ./gradlew :glomo-android-sdk:assembleRelease

            - name: Run tests
              run: ./gradlew :glomo-android-sdk:test

            - name: API compatibility check
              run: ./gradlew apiCheck
